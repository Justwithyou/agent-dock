        const input = document.getElementById("target-root-path");
        const button = document.querySelector('[data-action="pick-target-root"]');
        if (!context || !input || !button) return;
        button.disabled = true;
        try {
          const selected = await invoke("pick_directory", {startPath:context.root});
          if (selected) {
            input.value = displayPath(selected);
            input.setCustomValidity("");
            input.focus();
          }
        } catch (error) {
          toast("无法打开目录选择器：" + normalizeError(error, "pick_directory", context.root).reason);
        } finally {
          button.disabled = false;
        }
      }

      async function saveDistributionTarget(target, rootPath) {
        const context = currentAssetContext();
        if (!context || state.modalBusy) return;
        setModalBusy(true);
        try {
          await invoke("configure_distribution_target", {path:context.root,reference:context.reference,target,rootPath});
          const entry = selectedEntry();
          closeModal(true);
          state.distribution.mode = "custom";
          state.distribution.target = target;
          state.distribution.traeEdition = null;
          state.distribution.options = null;
          invalidateDistributionResults();
          if (entry && entry.asset && assetRef(entry.asset) === context.reference) await loadDistributionOptions(entry);
          toast(`已保存 ${target} 自定义目录；项目级或用户级可随时恢复自动分发`);
        } catch (error) {
          setModalBusy(false);
          setModalError(normalizeError(error, "configure_distribution_target", target));
        }
      }

      function openCreateTagModal() {
        const context = currentAssetContext();
        if (!context) return;
        const fullPrefix = `adock/${context.reference.replace(":", "/")}/`;
        openModal(modalHead("创建不可变版本标签","v* 标签创建后不可覆盖，也不会自动推送。") + `<form id="create-tag-form"><div class="modal-body"><div class="field"><label for="tag-name">标签名</label><input class="mono" id="tag-name" name="name" placeholder="v1.0.0" pattern="v[A-Za-z0-9._\\-]+" required autocomplete="off" aria-label="不可变版本标签名"><small>必须以 v 开头；完整标签：<span id="tag-full-preview" class="mono">${esc(fullPrefix)}v…</span></small></div><div class="field"><label for="tag-target">基于 revision</label><select id="tag-target" name="target" aria-label="版本标签目标 revision">${revisionOptions("HEAD", false)}</select><small>默认 HEAD，只允许已提交 revision。</small></div><div class="recent-path"><strong>只读资产上下文</strong><span class="mono">${esc(context.reference)}</span></div><div class="modal-error"></div></div><div class="modal-foot"><button type="button" class="btn" data-action="cancel-version">取消</button><button type="submit" class="btn primary" data-idle-label="创建标签" data-busy-label="正在创建…">创建标签</button></div></form>`, {kind:"create-tag"});
      }

      function openProdTargetModal(target = "HEAD") {
        const context = currentAssetContext();
        if (!context) return;
        state.version.prodPreview = null;
        openModal(modalHead("选择 prod 目标","下一步会显示当前指向与目标指向，确认前不会移动标签。") + `<form id="prod-target-form"><div class="modal-body"><div class="field"><label for="prod-target">目标 revision</label><select id="prod-target" name="target" aria-label="prod 目标 revision">${revisionOptions(target, false)}</select></div><div class="recent-path"><strong>完整标签</strong><span class="mono">adock/${esc(context.reference.replace(":", "/"))}/prod</span></div><div class="modal-error"></div></div><div class="modal-foot"><button type="button" class="btn" data-action="cancel-version">取消</button><button type="submit" class="btn primary">继续确认</button></div></form>`, {kind:"prod-target"});
      }

      function openProdConfirm(target) {
        const context = currentAssetContext();
        if (!context) return;
        const prod = state.version.tags.find(tag => tag.release_channel);
        state.version.prodPreview = {reference:context.reference,current:prod ? prod.commit : null,target};
        openModal(modalHead("二次确认：移动 prod","此操作只移动本地 Git 标签，不修改资产、不提交也不推送。") + `<form id="prod-confirm-form" data-target="${esc(target)}"><div class="modal-body"><div class="summary-list"><div class="summary-row"><span>资产</span><span class="mono">${esc(context.reference)}</span></div><div class="summary-row"><span>完整标签</span><span class="mono">adock/${esc(context.reference.replace(":", "/"))}/prod</span></div><div class="summary-row"><span>当前指向</span><span class="mono">${esc(prod ? prod.commit : "尚未创建")}</span></div><div class="summary-row"><span>目标指向</span><span class="mono">${esc(target)}</span></div></div><div class="inline-notice warn" style="margin-top:17px">${icon("info")}<div>只有点击“确认移动”才会写入标签。取消或返回均不会改变当前指向。</div></div><div class="modal-error"></div></div><div class="modal-foot"><button type="button" class="btn" data-action="cancel-version">取消</button><button type="button" class="btn" data-action="prod-back" data-target="${esc(target)}">返回</button><button type="submit" class="btn primary" data-idle-label="确认移动" data-busy-label="正在移动…">确认移动</button></div></form>`, {kind:"prod-confirm"});
      }

      function openRollbackModal(target = "") {
        const context = currentAssetContext();
        if (!context) return;
        state.version.rollbackPreview = null;
        openModal(modalHead("回滚向导：选择目标","先选择明确 revision，再检查脏路径并预览差异；此步骤不写入。") + `<form id="rollback-preview-form"><div class="modal-body"><div class="field"><label for="rollback-target">恢复到 revision</label><select id="rollback-target" name="target" required aria-label="回滚目标 revision">${revisionOptions(target, false, "选择回滚目标")}</select><small>不允许 working-tree；必须选择 HEAD、commit 或版本标签。</small></div><div class="recent-path"><strong>恢复范围</strong><span class="mono">${esc(context.reference)}</span></div><div class="inline-notice warn" style="margin-top:15px">${icon("info")}<div>目标资产存在未提交修改时会被阻止；其他资产的本地修改不会影响此检查。</div></div><div class="modal-error"></div></div><div class="modal-foot"><button type="button" class="btn" data-action="cancel-version">取消</button><button type="submit" class="btn primary" data-idle-label="检查并预览" data-busy-label="正在检查…">检查并预览</button></div></form>`, {kind:"rollback-target"});
      }

      function openRollbackConfirm(target, diff) {
        const context = currentAssetContext();
        if (!context) return;
        const files = Array.isArray(diff.files) ? diff.files : [];
        state.version.rollbackPreview = {reference:context.reference,target,diff};
        openModal(modalHead("回滚向导：确认恢复","确认后只生成当前资产的未提交恢复变更，不改写 Git 历史。") + `<form id="rollback-confirm-form" data-target="${esc(target)}"><div class="modal-body"><div class="summary-list"><div class="summary-row"><span>资产</span><span class="mono">${esc(context.reference)}</span></div><div class="summary-row"><span>目标 revision</span><span class="mono">${esc(target)}</span></div><div class="summary-row"><span>将变化的路径</span><span>${files.length} 个文件</span></div></div><div class="modal-diff" style="margin-top:16px"><div class="diff-card">${renderDiff(diff)}</div></div>${files.length ? '<div class="inline-notice warn" style="margin-top:15px">' + icon("info") + '<div>请确认以上差异。恢复后不会自动提交、推送或移动 prod。</div></div>' : '<div class="inline-notice" style="margin-top:15px">' + icon("info") + '<div>工作区已与目标快照一致，无需执行恢复。</div></div>'}<div class="modal-error"></div></div><div class="modal-foot"><button type="button" class="btn" data-action="cancel-version">取消</button><button type="button" class="btn" data-action="open-rollback" data-revision="${esc(target)}">返回</button><button type="submit" class="btn primary" data-idle-label="确认恢复" data-busy-label="正在恢复…" ${files.length ? "" : "disabled"}>确认恢复</button></div></form>`, {kind:"rollback-confirm",wide:true});
      }

      async function createTag(name, target) {
        const context = currentAssetContext();
        if (!context || state.modalBusy) return;
        setModalBusy(true);
        try {
          await invoke("create_version_tag", {...context,name,target,moveTag:false,confirmed:false});
          closeModal(true);
          await loadAssetHistory(selectedEntry());
          toast(`已创建 ${name}，未自动推送`);
        } catch (error) {
          const normalized = normalizeError(error, "create_version_tag", context.reference);
          setModalBusy(false);
          setModalError(normalized);
          await loadAssetHistory(selectedEntry());
        }
      }

      async function moveProd(target) {
        const context = currentAssetContext();
        if (!context || state.modalBusy) return;
        const preview = state.version.prodPreview;
        setModalBusy(true);
        try {
          if (!preview || preview.reference !== context.reference || preview.target !== target) {
            throw {code:"invalid_input",operation:"desktop.version.stale",subject:context.reference,reason:"prod 确认预览已失效，未移动标签。",suggestion:"请根据最新指向重新选择目标并确认。"};
          }
          const history = await invoke("get_asset_history", {path:context.root,reference:context.reference,limit:1});
          if (!history || !Array.isArray(history.tags)) {
            throw {code:"invalid_contract",operation:"get_asset_history",subject:context.reference,reason:"历史命令未返回 tags 数组。",suggestion:"请检查桌面历史 DTO。"};
          }
          const prod = history.tags.find(tag => tag.release_channel);
          const currentContext = currentAssetContext();
          if (!currentContext || currentContext.root !== context.root || currentContext.reference !== context.reference || state.version.prodPreview !== preview || (prod ? prod.commit : null) !== preview.current) {
            throw {code:"invalid_input",operation:"desktop.version.stale",subject:context.reference,reason:"prod 指向或资产上下文已变化，未按旧预览移动标签。",suggestion:"请根据最新指向重新选择目标并确认。"};
          }
          await invoke("create_version_tag", {...context,name:"prod",target,moveTag:true,confirmed:true});
          closeModal(true);
          await loadAssetHistory(selectedEntry());
          toast("prod 已移动，资产内容与提交历史未改变");
        } catch (error) {
          const normalized = normalizeError(error, "create_version_tag", `${context.reference} prod`);
          if (normalized.operation === "desktop.version.stale") {
            closeModal(true);
            await refreshWorkspace({quiet:true});
            openProdTargetModal(target);
            setModalError(normalized);
            toast("prod 预览已失效，请重新确认", "error");
          } else {
            setModalBusy(false);
            setModalError(normalized);
            await loadAssetHistory(selectedEntry());
          }
        }
      }

      async function previewRollback(target) {
        const context = currentAssetContext();
        if (!context || state.modalBusy || !target) return;
        setModalBusy(true);
        try {
          const diff = await invoke("preview_rollback", {...context,target});
          openRollbackConfirm(target, diff);
        } catch (error) {
          const normalized = normalizeError(error, "preview_rollback", context.reference);
          setModalBusy(false);
          setModalError(normalized);
          await loadAssetHistory(selectedEntry());
        }
      }

      async function applyRollback(target) {
        const context = currentAssetContext();
        if (!context || state.modalBusy) return;
        const preview = state.version.rollbackPreview;
        setModalBusy(true);
        try {
          if (!preview || preview.reference !== context.reference || preview.target !== target) {
            throw {code:"invalid_input",operation:"desktop.version.stale",subject:context.reference,reason:"回滚确认预览已失效，未写入恢复变更。",suggestion:"请重新检查目标并预览最新差异。"};
          }
          const freshDiff = await invoke("preview_rollback", {...context,target});
          const currentContext = currentAssetContext();
          if (!currentContext || currentContext.root !== context.root || currentContext.reference !== context.reference || state.version.rollbackPreview !== preview || JSON.stringify(freshDiff) !== JSON.stringify(preview.diff)) {
            throw {code:"invalid_input",operation:"desktop.version.stale",subject:context.reference,reason:"资产、目标 revision 或恢复差异已变化，未按旧预览执行回滚。",suggestion:"请重新检查目标并预览最新差异。"};
          }
          const diff = await invoke("rollback_asset", {...context,target,confirmed:true});
          closeModal(true);
          await refreshWorkspace({quiet:true});
          const current = currentAssetContext();
          if (current && current.reference === context.reference) {
            state.version.rollbackResult = diff;
            state.version.from = "HEAD";
            state.version.to = "working-tree";
            state.view = "history";
            render();
          }
          toast("已生成单资产未提交恢复变更，未自动提交或移动 prod");
        } catch (error) {
          const normalized = normalizeError(error, "rollback_asset", context.reference);
          await refreshWorkspace({quiet:true});
          openRollbackModal(target);
          setModalError(normalized);
          toast(normalized.operation === "desktop.version.stale" ? "回滚预览已失效，请重新预览" : "回滚未完成，工作区已重新读取", "error");
        }
      }

      document.addEventListener("submit", event => {
        if (event.target.id === "open-workspace-form") {
          event.preventDefault();
          const input = $("#open-workspace-path");
          if (!input.value.trim()) { input.setCustomValidity("请输入工作区路径"); input.reportValidity(); return; }
          input.setCustomValidity("");
          openWorkspace(input.value);
        } else if (event.target.id === "init-path-form") {
          event.preventDefault();
          const input = $("#init-workspace-path");
          const path = input.value.trim();
          if (!path) { input.setCustomValidity("请输入初始化目录"); input.reportValidity(); return; }
          input.setCustomValidity("");
          openInitConfirm(path);
        } else if (event.target.id === "init-confirm-form") {
          event.preventDefault();
          initializeWorkspace(event.target.dataset.path || "");
        } else if (event.target.id === "target-config-form") {
          event.preventDefault();
          const input = $("#target-root-path");
          const rootPath = input.value.trim();
          if (!rootPath) { input.setCustomValidity("请输入目标根目录"); input.reportValidity(); return; }
          input.setCustomValidity("");
          saveDistributionTarget($("#target-config-name").value, rootPath);
        } else if (event.target.id === "distribution-form") {
          event.preventDefault();
          previewDistribution();
        } else if (event.target.id === "diff-form") {
          event.preventDefault();
          const data = new FormData(event.target);
          compareAssets(String(data.get("from") || ""), String(data.get("to") || ""));
        } else if (event.target.id === "create-tag-form") {
          event.preventDefault();
          createTag($("#tag-name").value.trim(), $("#tag-target").value);
        } else if (event.target.id === "prod-target-form") {
          event.preventDefault();
          openProdConfirm($("#prod-target").value);
        } else if (event.target.id === "prod-confirm-form") {
          event.preventDefault();
          moveProd(event.target.dataset.target || "");
        } else if (event.target.id === "rollback-preview-form") {
          event.preventDefault();
          previewRollback($("#rollback-target").value);
        } else if (event.target.id === "rollback-confirm-form") {
          event.preventDefault();
          applyRollback(event.target.dataset.target || "");
        }
      });

      document.addEventListener("input", event => {
        const field = event.target.dataset.field;
        if (field === "search") {
          state.filters.search = event.target.value;
          renderKeepingFocus();
          scheduleAssetFilter();
        }
        const distributionVariable = event.target.dataset.distributionVariable;
        if (distributionVariable) {
          state.distribution.variables[distributionVariable] = event.target.value;
          state.distribution.overwriteManaged = false;
          invalidateDistributionResults();
          renderKeepingFocus();
        }
        if (["open-workspace-path","init-workspace-path","target-root-path"].includes(event.target.id)) event.target.setCustomValidity("");
        if (event.target.id === "tag-name") {
          const context = currentAssetContext();
          const preview = $("#tag-full-preview");
          if (context && preview) preview.textContent = `adock/${context.reference.replace(":", "/")}/${event.target.value || "v…"}`;
        }
      });

      document.addEventListener("change", event => {
        const field = event.target.dataset.field;
        if (["kind","owner","label"].includes(field)) {
          state.filters[field] = event.target.value;
          loadAssets(true);
        }
        const distributionField = event.target.dataset.distributionField;
        if (distributionField === "asset") {
          selectDistributionAsset(event.target.value);
          return;
        }
        if (distributionField === "traeEdition") {
          setDistributionTraeEdition(event.target.value);
          return;
        }
        if (distributionField === "target" || distributionField === "revision") {
          state.distribution[distributionField] = event.target.value;
          state.distribution.overwriteManaged = false;
          invalidateDistributionResults();
          render();
        }
        if (distributionField === "overwriteManaged") {
          state.distribution.overwriteManaged = event.target.checked;
          state.distribution.execution = null;
          state.distribution.executionError = null;
          render();
        }
        const versionField = event.target.dataset.versionField;
        if (versionField) {
          state.version[versionField] = event.target.value;
          invalidateVersionResults();
          render();
        }
      });

      document.addEventListener("click", event => {
        const element = event.target.closest("[data-action]");
        if (!element) return;
        const action = element.dataset.action;
        if (action === "backdrop") { if (event.target === element) closeModal(); return; }
        if (action === "close-modal") { closeModal(); return; }
        if (action === "workspace") { openWorkspaceModal(); return; }
        if (action === "init-workspace") { openInitModal(); return; }
        if (action === "init-from-open") { openInitModal($("#open-workspace-path") ? $("#open-workspace-path").value.trim() : ""); return; }
        if (action === "init-back") { openInitModal(element.dataset.path || ""); return; }
        if (action === "cancel-open") { closeModal(); toast("已取消打开工作区，当前工作区未改变", "warn"); return; }
        if (action === "cancel-init") { closeModal(); toast("已取消初始化，未创建或修改文件", "warn"); return; }
        if (action === "refresh") { refreshWorkspace(); return; }
        if (action === "retry-open") { openWorkspace(state.currentPath, {initial:true}); return; }
        if (action === "nav") {
          state.view = element.dataset.view || "assets";
          const entry = selectedEntry();
          if (state.view === "history" && entry && entry.asset && state.version.ref !== assetRef(entry.asset)) loadAssetHistory(entry);
          if (state.view === "distribute") loadDistributionOptions(entry);
          render();
          $("#main").focus();
          return;
        }
        if (action === "select-asset") {
          const entry = state.entries.find(item => item.key === element.dataset.key);
          if (!entry || entry.key === state.selectedKey && (state.detail || !entry.asset)) return;
          state.selectedKey = entry.key;
          resetVersionContext();
          loadDetail(entry);
          loadAssetHistory(entry);
          if (state.view === "distribute") loadDistributionOptions(entry);
          return;
        }
        if (action === "retry-detail") { loadDetail(selectedEntry()); return; }
        if (action === "clear-filters") { state.filters = {search:"",kind:"all",owner:"all",label:"all"}; loadAssets(true); return; }
        if (action === "validate") { validateWorkspace(); return; }
        if (action === "asset-guide") { openAssetGuide(); return; }
        if (action === "retry-history") { loadAssetHistory(selectedEntry()); return; }
        if (action === "execute-distribution") { executeDistribution(); return; }
        if (action === "replan-distribution" || action === "retry-distribution") { previewDistribution(); return; }
        if (action === "retry-distribution-options") { loadDistributionOptions(selectedEntry()); return; }
        if (action === "set-distribution-scope") { setDistributionScope(element.dataset.scope || "project"); return; }
        if (action === "advanced-distribution") { openAdvancedDistribution(); return; }
        if (action === "configure-target") { openTargetConfigModal(); return; }
        if (action === "pick-target-root") { pickTargetRoot(); return; }
        if (action === "set-diff-from" || action === "set-diff-to") {
          state.version[action === "set-diff-from" ? "from" : "to"] = element.dataset.revision || "";
          invalidateVersionResults();
          render();
          return;
        }
        if (action === "create-tag") { openCreateTagModal(); return; }
        if (action === "move-prod") { openProdTargetModal(); return; }
        if (action === "prod-back") { openProdTargetModal(element.dataset.target || "HEAD"); return; }
        if (action === "open-rollback") { openRollbackModal(element.dataset.revision || ""); return; }
        if (action === "show-rollback-diff") { compareAssets("HEAD", "working-tree"); return; }
        if (action === "cancel-version") { closeModal(); toast("已取消操作，未写入标签或资产文件", "warn"); return; }
      });

      document.addEventListener("keydown", event => {
        const modal = $(".modal");
        if (!modal) return;
        if (event.key === "Escape") {
          event.preventDefault();
          closeModal();
          return;
        }
        if (event.key !== "Tab") return;
        const focusable = $$("button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex='-1'])", modal).filter(item => item.offsetParent !== null);
        if (!focusable.length) { event.preventDefault(); return; }
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      });

      render();
      if (recentPath) openWorkspace(recentPath, {initial:true});
    })();
  </script>
</body>
</html>
