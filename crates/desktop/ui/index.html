    @media(max-width:1220px){.sidebar{width:182px}.main{padding:22px 20px 30px}.asset-layout{grid-template-columns:280px minmax(0,1fr)}.topbar{gap:11px;padding:0 16px}.branch{display:none}.workspace-chip{max-width:330px}.meta-grid{grid-template-columns:1fr 1fr}.collab-grid{grid-template-columns:1fr}.collab-card.wide{grid-column:auto!important}}
    @media(max-width:1100px){.history-grid{grid-template-columns:1fr}.diff-form{grid-template-columns:1fr 1fr}.diff-form .btn{grid-column:1/-1}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>AgentDock</span></div>
      <div class="top-sep"></div>
      <button class="workspace-chip" type="button" data-action="workspace" aria-label="打开或切换工作区">
        <span><strong id="workspace-name">未打开工作区</strong><small id="workspace-path">选择本地 Git 资产仓库</small></span>
        <span class="soft" aria-hidden="true">⌄</span>
      </button>
      <span class="branch" id="branch-status"></span>
      <div class="top-spacer"></div>
      <span class="local-badge">本地工作区</span>
      <button class="icon-btn" type="button" data-action="refresh" title="刷新工作区" aria-label="刷新工作区" id="refresh-button"></button>
    </header>
    <div class="app-body">
      <aside class="sidebar">
        <div class="nav-label">工作区</div>
        <nav class="nav" aria-label="主导航" id="main-nav"></nav>
        <div class="sidebar-bottom">
          <div class="source-card"><div class="source-title"><span class="status-dot" id="source-dot"></span>Git 为唯一事实源</div><p>资产直接来自当前仓库。刷新会重新读取 Git 与文件系统，不使用桌面私有资产副本。</p></div>
          <div class="version">AgentDock 桌面端 · MVP v0.1</div>
        </div>
      </aside>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
  <script>
    (() => {
      "use strict";

      const $ = (selector, root = document) => root.querySelector(selector);
      const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
      const esc = (value = "") => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
      const STORAGE_KEY = "agentdock.recentWorkspace";
      const paths = {
        assets:'<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h5l2 2h6A1.5 1.5 0 0 1 20 7.5v10a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><path d="M4 9h16"/>',
        history:'<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2M4 4v4h4"/>',
        distribute:'<path d="M12 3v12m0-12 4 4m-4-4L8 7M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>',
        collab:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2"/><path d="M3 20c0-4 2-6 6-6s6 2 6 6M15 15c3 0 5 2 5 5"/>',
        refresh:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 8a7 7 0 0 1 11.8-1L20 12M4 12l2.1 5a7 7 0 0 0 11.8-1"/>',
        search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',
        file:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h5"/>',
        check:'<path d="m5 12 4 4L19 6"/>',
        error:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4h.01"/>',
        info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/>',
        plus:'<path d="M12 5v14M5 12h14"/>',
        git:'<path d="m11 3 10 10-8 8-10-10 8-8Z"/><circle cx="8" cy="12" r="1.5"/><circle cx="12" cy="8" r="1.5"/><circle cx="16" cy="12" r="1.5"/><path d="m9 11 2-2m2 1 2 2"/>',
        close:'<path d="m6 6 12 12M18 6 6 18"/>',
        folder:'<path d="M3 6h7l2 2h9v12H3z"/>'
      };
      const icon = name => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name] || paths.info}</svg>`;
      const navItems = [["assets","资产","assets"],["history","历史","history"],["distribute","分发","distribute"],["collab","协作说明","collab"]];

      function readRecent() {
        try { return localStorage.getItem(STORAGE_KEY) || ""; } catch (_) { return ""; }
      }
      function saveRecent(path) {
        recentPath = path;
        try { localStorage.setItem(STORAGE_KEY, path); } catch (_) { /* 存储不可用时仍可继续打开工作区。 */ }
      }

      let recentPath = readRecent();
      const state = {
        view: "assets",
        workspace: null,
        currentPath: recentPath,
        workspaceError: null,
        loadingWorkspace: false,
        loadingAssets: false,
        assetsLoaded: false,
        assetsError: null,
        entries: [],
        allEntries: [],
        selectedKey: null,
        detail: null,
        detailLoading: false,
        detailError: null,
        validating: false,
        filters: {search:"", kind:"all", owner:"all", label:"all"},
        version: {
          ref: null, commits: [], tags: [], loading: false, error: null,
          from: "", to: "", diff: null, diffLoading: false, diffError: null,
          rollbackResult: null, rollbackPreview: null, prodPreview: null
        },
        modalBusy: false,
        modalKind: null,
        distribution: {
          ref: null, options: null, optionsLoading: false, optionsError: null,
          mode: "standard", scope: "project", traeEdition: null, target: "", revision: "", variables: {}, overwriteManaged: false,
          plan: null, planLoading: false, planError: null,
          executing: false, execution: null, executionError: null
        }
      };
      let workspaceEpoch = 0;
      let assetsEpoch = 0;
      let filterTimer = null;
      let detailEpoch = 0;
      let historyEpoch = 0;
      let diffEpoch = 0;
      let distributionEpoch = 0;
      let distributionOptionsEpoch = 0;
      let toastTimer = null;
      let modalReturnFocus = null;

      function normalizeError(error, operation = "desktop.invoke", subject = "当前操作") {
        if (error && typeof error === "object") {
          return {
            code: String(error.code || "invoke_failed"),
            operation: String(error.operation || operation),
            subject: displayDiagnostic(error.subject || subject),
            reason: displayDiagnostic(error.reason || error.message || "操作失败"),
            suggestion: displayDiagnostic(error.suggestion || "请检查工作区后重试")
          };
        }
        return {code:"invoke_failed",operation,subject:displayDiagnostic(subject),reason:displayDiagnostic(error || "操作失败"),suggestion:"请检查工作区后重试"};
      }

      async function invoke(command, args) {
        const bridge = window.__TAURI__ && window.__TAURI__.core;
        if (!bridge || typeof bridge.invoke !== "function") {
          throw {
            code: "desktop_bridge_unavailable",
            operation: command,
            subject: "Tauri 桌面桥接",
            reason: "当前页面无法调用桌面命令。",
            suggestion: "请在 AgentDock 桌面应用中打开此页面，并由桌面端注册所需命令。"
          };
        }
        return bridge.invoke(command, args);
      }

      function toast(message, type = "success") {
        clearTimeout(toastTimer);
        $("#toast-root").innerHTML = `<div class="toast ${type === "error" ? "error" : type === "warn" ? "warn" : ""}" role="status">${icon(type === "error" ? "error" : type === "warn" ? "info" : "check")}<span>${esc(displayDiagnostic(message))}</span></div>`;
        toastTimer = setTimeout(() => { $("#toast-root").innerHTML = ""; }, 4200);
      }

      function rootName(path) {
        const parts = String(path || "").split(/[\\/]/).filter(Boolean);
        return parts[parts.length - 1] || path || "未打开工作区";
      }

      function displayPath(path) {
        const value = String(path || "");
        if (/^\\\\\?\\UNC\\/i.test(value)) return `\\\\${value.slice(8)}`;
        if (value.startsWith("\\\\?\\")) return value.slice(4);
        return value;
      }

      function displayDiagnostic(value) {
        return String(value ?? "").replace(/\\\\\?\\UNC\\/gi, "\\\\").replace(/\\\\\?\\/g, "");
      }

      function selectedEntry() {
        return state.entries.find(entry => entry.key === state.selectedKey) || null;
      }

      function assetRef(asset) {
        const metadata = asset && asset.metadata;
        return metadata ? `${metadata.kind}:${metadata.id}` : "";
      }

      function workspaceBranch() {
        const info = state.workspace || {};
        return info.branch || info.current_branch || info.currentBranch || info.git_branch || "";
      }

      function renderChrome() {
        const workspace = state.workspace;
        $("#workspace-name").textContent = workspace ? rootName(workspace.root) : state.currentPath ? rootName(state.currentPath) : "未打开工作区";
        $("#workspace-path").textContent = workspace ? displayPath(workspace.root) : displayPath(state.currentPath) || "选择本地 Git 资产仓库";
        const hasError = Boolean(state.workspaceError || state.assetsError);
        const branch = workspaceBranch();
        $("#branch-status").innerHTML = workspace || state.currentPath ? `${icon("git")}<span>${esc(branch || "本地仓库")}</span><span class="badge ${hasError ? "error" : workspace ? "success" : "warn"}"><span class="status-dot ${hasError ? "error" : workspace ? "" : "warn"}"></span>${hasError ? "需要处理" : workspace ? "已连接" : "未连接"}</span>` : "";
        $("#source-dot").className = `status-dot ${hasError ? "error" : workspace ? "" : "warn"}`;
        const refresh = $("#refresh-button");
        refresh.innerHTML = state.loadingWorkspace || state.loadingAssets ? '<span class="spinner" style="width:15px;height:15px"></span>' : icon("refresh");
        refresh.disabled = !state.currentPath || state.loadingWorkspace || state.loadingAssets || state.modalBusy;
        $("#main-nav").innerHTML = navItems.map(([id,label,ico]) => `<button type="button" class="nav-btn ${state.view === id ? "active" : ""}" data-action="nav" data-view="${id}" aria-label="打开${label}页面">${icon(ico)}<span>${label}</span>${id === "assets" ? `<span class="nav-count">${state.allEntries.length}</span>` : ""}</button>`).join("");
      }

      function pageHead(title, description, actions = "") {
        return `<div class="page-head"><div><h1>${title}</h1><p>${description}</p></div><div class="head-actions">${actions}</div></div>`;
      }

      function loadingState(title, description) {
        return `<div class="state-page loading-page"><div class="spinner" style="margin:0 auto 20px"></div><h1>${esc(title)}</h1><p>${esc(description)}</p></div>`;
      }

      function errorDetails(error) {
        const item = normalizeError(error);
        return `<dl class="error-lines"><dt>操作</dt><dd class="mono">${esc(item.operation)}</dd><dt>对象</dt><dd class="mono">${esc(item.subject)}</dd><dt>原因</dt><dd>${esc(item.reason)}</dd><dt>建议</dt><dd>${esc(item.suggestion)}</dd>${item.code ? `<dt>错误类别</dt><dd class="mono">${esc(item.code)}</dd>` : ""}</dl>`;
      }

      function errorNotice(error) {
        return `<div class="inline-notice error">${icon("error")}<div class="error-block"><strong>操作未完成</strong>${errorDetails(error)}</div></div>`;
      }

      function workspaceErrorKind(error) {
        const code = String(error.code || "").toLowerCase();
        const text = `${error.reason || ""} ${error.subject || ""} ${error.operation || ""}`.toLowerCase();
        if (code.includes("not_git") || code.includes("non_git") || /非\s*git|not\s+(?:a\s+)?git|git\s+repository|\.git/.test(text)) return "git";
        if (code === "workspace_not_found") return "missing";
        if (code.includes("config") || /adock\.ya?ml|config(?:uration)?|配置/.test(text)) return "config";
        return "io";
      }

      function renderWorkspaceError() {
        const error = normalizeError(state.workspaceError, "discover_workspace", state.currentPath || "工作区");
        const kind = workspaceErrorKind(error);
        const content = {
          git:{icon:"git",title:"该目录不是可用的 Git 工作区",text:"可以重新选择目录或查看初始化说明。历史、版本标签与分发不会在非 Git 工作区中启用。"},
          missing:{icon:"folder",title:"未找到 AgentDock 工作区",text:"所选目录及其父目录中没有可用的 adock.yaml。可以打开其他目录，或在空目录中初始化新工作区。"},
          config:{icon:"error",title:"工作区配置需要修复",text:"配置或仓库状态阻止了资产读取。请按诊断修复后刷新，页面不会自动改写配置。"},
          io:{icon:"error",title:"工作区读取失败",text:"路径已保留。请检查目录权限与配置，修复后重试，或重新选择工作区。"}
        }[kind];
        return `<div class="state-page"><div class="state-icon error">${icon(content.icon)}</div><h1>${content.title}</h1><p>${content.text}</p><div class="state-diagnostic">${errorDetails(error)}</div><div class="state-actions">${state.currentPath ? `<button type="button" class="btn primary" data-action="retry-open" aria-label="重试读取当前工作区">${icon("refresh")}修复后重试</button>` : ""}<button type="button" class="btn" data-action="workspace" aria-label="重新选择工作区">重新选择工作区</button><button type="button" class="btn" data-action="init-workspace" aria-label="初始化新工作区">初始化新工作区</button></div></div>`;
      }

      function renderWelcome() {
        return `<div class="state-page"><div class="state-icon">${icon("assets")}</div><h1>打开团队能力工作区</h1><p>选择一个包含 adock.yaml 的 Git 资产仓库，直接发现其中的 Prompt 与 Skill。无需导入，也不会创建桌面私有副本。</p><div class="state-diagnostic"><div class="summary-list"><div class="summary-row"><span>资产目录</span><span class="mono">prompts/ · skills/</span></div><div class="summary-row"><span>工作区配置</span><span class="mono">adock.yaml</span></div><div class="summary-row"><span>读取方式</span><span>共享 Rust 应用服务</span></div></div></div><div class="state-actions"><button type="button" class="btn primary" data-action="workspace" aria-label="打开本地工作区">${icon("folder")}打开工作区</button><button type="button" class="btn" data-action="init-workspace" aria-label="初始化新工作区">${icon("plus")}初始化新工作区</button></div>${recentPath ? `<p class="soft mono">最近路径：${esc(displayPath(recentPath))}</p>` : ""}</div>`;
      }

      function renderAssetsError() {
        return `<div class="state-page"><div class="state-icon error">${icon("error")}</div><h1>资产读取失败</h1><p>工作区路径已保留。请按诊断修复后重新读取；本次失败不会被显示为空仓库。</p><div class="state-diagnostic">${errorDetails(state.assetsError)}</div><div class="state-actions"><button type="button" class="btn primary" data-action="refresh" aria-label="重新读取资产">${icon("refresh")}重新读取</button><button type="button" class="btn" data-action="workspace" aria-label="打开其他工作区">打开其他工作区</button></div></div>`;
      }

      function renderEmptyWorkspace() {
        return `<div class="state-page"><div class="state-icon">${icon("assets")}</div><h1>工作区还没有能力资产</h1><p>目录结构已就绪。通过团队 Git 评审流程新增第一个 Prompt 或 Skill，刷新后即可在这里查看真实详情。</p><div class="state-diagnostic"><div class="summary-list"><div class="summary-row"><span>Prompt 目录</span><span class="mono">prompts/</span></div><div class="summary-row"><span>Skill 目录</span><span class="mono">skills/&lt;skill-id&gt;/SKILL.md</span></div><div class="summary-row"><span>当前工作区</span><span class="mono">${esc(displayPath(state.workspace.root))}</span></div></div></div><div class="inline-notice">${icon("info")}<div>空资产结果与读取失败分开显示。新增资产仍需遵循仓库规范与 MR/PR 流程，本页面不会伪造创建操作。</div></div><div class="state-actions"><button type="button" class="btn primary" data-action="asset-guide" aria-label="查看新增资产指引">查看新增资产指引</button><button type="button" class="btn" data-action="refresh" aria-label="刷新空工作区">${icon("refresh")}刷新</button></div></div>`;
      }

      function validAssets() {
        return state.allEntries.map(entry => entry.asset).filter(Boolean);
      }

      function filterValues(field) {
        const values = new Set();
        validAssets().forEach(asset => {
          const items = field === "owner" ? asset.metadata.owners || [] : asset.metadata.labels || [];
          items.forEach(value => values.add(String(value)));
        });
        const current = state.filters[field];
        if (current !== "all") values.add(current);
        return [...values].sort((a,b) => a.localeCompare(b, "zh-CN"));
      }

      function hasFilters() {
        const filter = state.filters;
        return Boolean(filter.search) || filter.kind !== "all" || filter.owner !== "all" || filter.label !== "all";
      }

      function renderAssetItem(entry) {
        const active = state.selectedKey === entry.key ? "active" : "";
        if (!entry.asset) {
          const subject = entry.error.subject || "未知资产";
          return `<button type="button" class="asset-item ${active}" data-action="select-asset" data-key="${entry.key}" aria-label="查看损坏资产 ${esc(subject)} 的错误"><span class="asset-item-head"><span class="badge error">错误</span><strong>无法读取资产</strong></span><span class="ref mono">${esc(subject)}</span><span class="desc">${esc(entry.error.reason)}</span><span class="asset-item-foot"><span>资产级诊断</span><span>未解析</span></span></button>`;
        }
        const asset = entry.asset;
        const metadata = asset.metadata;
        const kind = metadata.kind === "skill" ? "skill" : "prompt";
        const title = String(metadata.title || metadata.id || "未命名资产");
        const owners = (metadata.owners || []).join(" / ") || "未声明负责人";
        const labels = (metadata.labels || []).join(" / ");
        return `<button type="button" class="asset-item ${active}" data-action="select-asset" data-key="${entry.key}" aria-label="查看资产 ${esc(title)}"><span class="asset-item-head"><span class="badge ${kind}">${kind === "prompt" ? "P" : "S"}</span><strong>${esc(title)}</strong></span><span class="ref mono">${esc(assetRef(asset))}</span><span class="desc">${esc(metadata.description || "未提供说明")}</span><span class="asset-item-foot"><span>${esc(owners)}${labels ? ` · ${esc(labels)}` : ""}</span><span>${kind === "prompt" ? "Prompt" : "Skill"}</span></span></button>`;
      }

      function skeletonLines(count = 3) {
        return `<div class="skeleton">${Array.from({length:count}, (_,index) => `<div class="skeleton-line ${index % 3 === 0 ? "short" : index % 3 === 1 ? "mid" : ""}"></div>`).join("")}</div>`;
      }

      function renderAssetDetail() {
        const entry = selectedEntry();
        if (!entry) return `<section class="card asset-detail"><div class="detail-empty">选择左侧资产以查看元数据、正文和源文件。</div></section>`;
        if (!entry.asset) {
          return `<section class="card asset-detail"><div class="detail-hero"><div class="detail-title"><span class="badge error">解析失败</span><h2>无法读取资产</h2></div><div class="detail-ref mono">${esc(entry.error.subject)}</div></div><div class="detail-section">${errorNotice(entry.error)}<div class="detail-actions"><button type="button" class="btn" data-action="asset-guide" aria-label="查看资产修复规范">查看资产规范</button><button type="button" class="btn primary" data-action="validate" aria-label="重新校验工作区" ${state.validating ? "disabled" : ""}>${icon("check")}重新校验</button></div></div><div class="detail-section"><div class="inline-notice">${icon("info")}<div>这是单个资产的错误，不会影响其他正常资产。修复对应文件后可刷新或重新校验。</div></div></div></section>`;
        }
        if (state.detailLoading && !state.detail) {
          return `<section class="card asset-detail"><div class="detail-hero"><div class="loading-inline muted">${icon("file")}正在读取 ${esc(assetRef(entry.asset))} 的完整详情…</div></div>${skeletonLines(7)}</section>`;
        }
        if (state.detailError) {
          return `<section class="card asset-detail"><div class="detail-hero"><div class="detail-title"><span class="badge error">读取失败</span><h2>${esc(entry.asset.metadata.title)}</h2></div><div class="detail-ref mono">${esc(assetRef(entry.asset))}</div></div><div class="detail-section">${errorNotice(state.detailError)}<div class="detail-actions"><button type="button" class="btn primary" data-action="retry-detail" aria-label="重试读取资产详情">${icon("refresh")}重试详情</button><button type="button" class="btn" data-action="refresh" aria-label="刷新整个工作区">刷新工作区</button></div></div></section>`;
        }
        const asset = state.detail || entry.asset;
        const metadata = asset.metadata || {};
        const kind = metadata.kind === "skill" ? "skill" : "prompt";
        const spec = asset.spec && asset.spec.value ? asset.spec.value : {};
        const files = Array.isArray(asset.source_files) ? asset.source_files : [];
        const title = metadata.title || metadata.id || "未命名资产";
        const versionLabels = extractVersionLabels(asset);
        return `<section class="card asset-detail"><div class="detail-hero"><div class="detail-title"><span class="badge ${kind}">${kind === "prompt" ? "Prompt" : "Skill"}</span><h2>${esc(title)}</h2></div><div class="detail-ref mono">${esc(assetRef(asset))}</div><p class="detail-desc">${esc(metadata.description || "未提供说明")}</p><div class="detail-actions"><button type="button" class="btn" data-action="nav" data-view="history" aria-label="查看资产历史与版本">${icon("history")}查看历史</button><button type="button" class="btn primary" data-action="nav" data-view="distribute" aria-label="查看分发模块接入说明">${icon("distribute")}进入分发</button></div></div><div class="release-strip"><span class="release-item"><span class="soft">当前快照</span><span class="tag version mono">工作区</span></span>${versionLabels.map(label => `<span class="tag version mono">${esc(label)}</span>`).join("")}<span class="spacer"></span><span class="soft">${state.version.loading && state.version.ref === assetRef(asset) ? "正在读取版本标签" : versionLabels.length ? "版本标签" : "暂无版本标签"}</span></div><div class="detail-section"><h3 class="section-title">资产信息<span class="badge success">工作区数据</span></h3><dl class="meta-grid"><div class="meta-item"><dt>资产 ID</dt><dd class="mono">${esc(metadata.id)}</dd></div><div class="meta-item"><dt>负责人</dt><dd>${esc((metadata.owners || []).join(" / ") || "—")}</dd></div><div class="meta-item"><dt>API 版本</dt><dd class="mono">${esc(metadata.api_version || "—")}</dd></div><div class="meta-item"><dt>分类标签</dt><dd class="tags">${(metadata.labels || []).length ? metadata.labels.map(label => `<span class="tag">${esc(label)}</span>`).join("") : "—"}</dd></div><div class="meta-item"><dt>资产类型</dt><dd>${kind === "prompt" ? "Prompt · 单文件" : "Skill · 目录"}</dd></div><div class="meta-item"><dt>源文件范围</dt><dd>${files.length} 个文件</dd></div></dl></div>${kind === "prompt" ? renderPromptInfo(spec, asset.body) : renderSkillInfo(spec, asset.body)}<div class="detail-section"><h3 class="section-title">源文件<span class="soft">${files.length} 个文件</span></h3>${files.length ? files.map(file => `<div class="file-row">${icon("file")}<span class="mono">${esc(displayPath(file))}</span></div>`).join("") : '<div class="muted">后端未返回源文件。</div>'}</div></section>`;
      }

      function extractVersionLabels(asset) {
        const reference = assetRef(asset);
        if (state.version.ref !== reference) return [];
        return state.version.tags.map(tag => tag.full_name).filter(Boolean);
      }

      function renderPromptInfo(spec, body) {
        const variables = Array.isArray(spec.variables) ? spec.variables : [];
        return `<div class="detail-section"><h3 class="section-title">模板变量<span class="soft">显式传值时才渲染</span></h3>${variables.length ? `<div class="table-wrap"><table class="variable-table"><thead><tr><th>变量</th><th>说明</th><th>必填</th><th>默认值</th></tr></thead><tbody>${variables.map(variable => `<tr><td class="mono">{{${esc(variable.name)}}}</td><td>${esc(variable.description || "—")}</td><td>${variable.required ? '<span class="required">必填</span>' : "否"}</td><td class="mono">${esc(variable.default === null || variable.default === undefined ? "—" : variable.default === "" ? '""' : variable.default)}</td></tr>`).join("")}</tbody></table></div>` : '<div class="muted">此 Prompt 未声明模板变量。</div>'}</div><div class="detail-section"><h3 class="section-title">Markdown 正文<span class="soft">不执行表达式</span></h3><pre class="prompt-body">${esc(body || "")}</pre></div>`;
      }

      function renderSkillInfo(spec, body) {
        const triggers = Array.isArray(spec.triggers) ? spec.triggers : [];
        const dependencies = Array.isArray(spec.dependencies) ? spec.dependencies : [];
        return `<div class="detail-section"><h3 class="section-title">触发条件与依赖<span class="soft">不递归安装依赖</span></h3><dl class="meta-grid"><div class="meta-item"><dt>触发条件</dt><dd>${triggers.length ? triggers.map(trigger => `<div>${esc(trigger)}</div>`).join("") : "—"}</dd></div><div class="meta-item"><dt>依赖声明</dt><dd>${dependencies.length ? dependencies.map(dependency => `<div class="mono">${esc(dependency)}</div>`).join("") : "—"}</dd></div><div class="meta-item"><dt>入口</dt><dd class="mono">${esc(spec.entrypoint || "—")}</dd></div></dl>${dependencies.length ? `<div class="inline-notice" style="margin-top:14px">${icon("info")}<div>此处仅展示 Skill 声明的依赖，不执行脚本，也不自动递归安装。</div></div>` : ""}</div><div class="detail-section"><h3 class="section-title">Skill 指令正文</h3><pre class="prompt-body">${esc(body || "")}</pre></div>`;
      }

      function renderAssets() {
        const list = state.entries;
        const owners = filterValues("owner");
        const labels = filterValues("label");
        const loadingText = state.loadingAssets ? '<span class="loading-inline"><span class="spinner"></span>正在读取</span>' : "按工作区读取";
        const actions = `<button type="button" class="btn" data-action="validate" aria-label="校验整个工作区" ${state.validating || state.loadingAssets ? "disabled" : ""}>${icon("check")}${state.validating ? "正在校验…" : "校验工作区"}</button><button type="button" class="btn primary" data-action="asset-guide" aria-label="查看新增资产指引">${icon("plus")}新增资产</button>`;
        return pageHead("能力资产","发现团队沉淀的 Prompt 与 Skill，查看用途、负责人、变量、依赖和源文件。",actions) + `<div class="asset-layout"><section class="card asset-browser"><div class="filters"><div class="search">${icon("search")}<input data-field="search" value="${esc(state.filters.search)}" placeholder="搜索名称、ID 或说明" aria-label="搜索资产" autocomplete="off"></div><div class="filter-row"><select data-field="kind" aria-label="按资产类型过滤"><option value="all">全部类型</option><option value="prompt" ${state.filters.kind === "prompt" ? "selected" : ""}>Prompt</option><option value="skill" ${state.filters.kind === "skill" ? "selected" : ""}>Skill</option></select><select data-field="owner" aria-label="按负责人过滤"><option value="all">全部负责人</option>${owners.map(owner => `<option value="${esc(owner)}" ${state.filters.owner === owner ? "selected" : ""}>${esc(owner)}</option>`).join("")}</select><select data-field="label" aria-label="按分类标签过滤"><option value="all">全部分类标签</option>${labels.map(label => `<option value="${esc(label)}" ${state.filters.label === label ? "selected" : ""}>${esc(label)}</option>`).join("")}</select></div></div><div class="list-meta"><span>${list.length} / ${state.allEntries.length} 项资产</span><span class="loading-inline">${loadingText}${hasFilters() ? `<button type="button" class="btn ghost small" data-action="clear-filters" aria-label="清除全部过滤条件">清除过滤</button>` : ""}</span></div><div class="asset-list">${state.loadingAssets && !state.assetsLoaded ? skeletonLines(5) : list.length ? list.map(renderAssetItem).join("") : `<div class="empty-filter">没有符合当前条件的资产。<br><button type="button" class="btn small" data-action="clear-filters" aria-label="清除资产过滤条件">清除过滤</button></div>`}</div></section>${renderAssetDetail()}</div>`;
      }

      function shortSha(value) {
        return value ? String(value).slice(0, 8) : "—";
      }

      function revisionOptions(selected, includeWorking = true, placeholder = "") {
        const revisions = [];
        if (includeWorking) revisions.push({value:"working-tree",label:"工作区 · 未提交内容"});
        revisions.push({value:"HEAD",label:"HEAD · 最新提交"});
        state.version.tags.forEach(tag => revisions.push({value:tag.full_name,label:`${tag.name} · ${shortSha(tag.commit)}`}));
        state.version.commits.forEach(commit => revisions.push({value:commit.commit,label:`${shortSha(commit.commit)} · ${commit.message.split("\n")[0]}`}));
        return `${placeholder !== "" ? `<option value="" ${selected ? "" : "selected"}>${esc(placeholder)}</option>` : ""}${revisions.map(revision => `<option value="${esc(revision.value)}" ${selected === revision.value ? "selected" : ""}>${esc(revision.label)}</option>`).join("")}`;
      }

      function renderCommit(commit) {
        const tags = state.version.tags.filter(tag => tag.commit === commit.commit);
        return `<article class="commit-item"><div class="commit-top"><span class="commit-sha mono">${esc(shortSha(commit.commit))}</span><span class="badge">commit</span></div><div class="commit-message">${esc(commit.message)}</div><div class="commit-meta">${esc(commit.author)} · ${esc(commit.committed_at)}</div>${tags.length ? `<div class="commit-tags">${tags.map(tag => `<span class="tag version mono" title="${esc(tag.full_name)}">${esc(tag.name)}</span>`).join("")}</div>` : ""}<div class="commit-actions"><button type="button" class="btn ghost small" data-action="set-diff-from" data-revision="${esc(commit.commit)}" aria-label="将 ${esc(shortSha(commit.commit))} 设为比较起点">设为起点</button><button type="button" class="btn ghost small" data-action="set-diff-to" data-revision="${esc(commit.commit)}" aria-label="将 ${esc(shortSha(commit.commit))} 设为比较终点">设为终点</button><button type="button" class="btn small" data-action="open-rollback" data-revision="${esc(commit.commit)}" aria-label="恢复到 ${esc(shortSha(commit.commit))}">恢复到此版本</button></div></article>`;
      }

      function renderVersionTag(tag) {
        return `<div class="version-tag-item"><div class="version-tag-name mono">${esc(tag.full_name)}</div><div class="version-tag-meta"><span class="mono">${esc(shortSha(tag.commit))}</span><span class="badge ${tag.release_channel ? "success" : ""}">${tag.release_channel ? "可移动发布通道" : tag.immutable ? "不可变版本" : "版本标签"}</span></div></div>`;
      }

      function renderDiff(diff) {
        if (!diff) return "";
        const files = Array.isArray(diff.files) ? diff.files : [];
        const changeLabels = {added:"新增",removed:"删除",modified:"修改"};
        return `<div class="diff-summary"><span class="mono">${esc(shortSha(diff.from_commit))}</span><span>→</span><span class="mono">${esc(diff.to_commit || "工作区")}</span><span class="badge">${files.length} 个变化文件</span></div>${files.length ? `<div class="diff-files">${files.map(file => `<section class="diff-file"><div class="diff-file-head"><span class="badge ${file.change === "removed" ? "error" : file.change === "added" ? "success" : "warn"}">${esc(changeLabels[file.change] || file.change)}</span><span class="diff-path mono">${esc(displayPath(file.path))}</span>${file.binary ? '<span class="badge warn">二进制</span>' : ""}</div>${file.binary ? `<div class="binary-note">二进制文件已变化，不生成文本差异。</div>` : file.text_diff ? `<pre class="diff-text">${file.text_diff.replace(/\n$/, "").split("\n").map(line => `<span class="diff-line ${line.startsWith("+") ? "add" : line.startsWith("-") ? "del" : line.startsWith("@@") ? "hunk" : ""}">${esc(line)}</span>`).join("")}</pre>` : '<div class="binary-note">无可用文本差异。</div>'}</section>`).join("")}</div>` : '<div class="diff-empty">两个明确快照之间没有资产内容差异。</div>'}`;
      }

      function renderDiffPanel() {
        const version = state.version;
        let result = '<div class="diff-empty">请明确选择比较起点与终点。比较操作不会修改工作区。</div>';
        if (version.diffLoading) result = '<div class="diff-empty"><span class="loading-inline"><span class="spinner"></span>正在读取两个 Git 快照</span></div>';
        else if (version.diffError) result = `<div style="padding:16px">${errorNotice(version.diffError)}</div>`;
        else if (version.diff) result = renderDiff(version.diff);
        return `<section class="card diff-card"><div class="history-card-head"><h2>双 revision 差异</h2><span class="soft">统一文本视图 · 覆盖 Skill 整个目录</span></div><form id="diff-form" class="diff-form"><div class="field"><label for="diff-from">比较起点</label><select id="diff-from" name="from" data-version-field="from" aria-label="选择比较起点" required>${revisionOptions(version.from, true, "选择起点")}</select></div><div class="field"><label for="diff-to">比较终点</label><select id="diff-to" name="to" data-version-field="to" aria-label="选择比较终点" required>${revisionOptions(version.to, true, "选择终点")}</select></div><button type="submit" class="btn primary" ${version.diffLoading ? "disabled" : ""} aria-label="比较两个明确版本">比较差异</button></form>${result}</section>`;
      }

      function renderHistory() {
        const entry = selectedEntry();
        if (!entry || !entry.asset) return `<div class="state-page"><div class="state-icon">${icon("history")}</div><h1>先选择一个可读取的资产</h1><p>历史、版本标签和回滚均继承当前 AssetRef。损坏资产需先修复，其他正常资产不受影响。</p><div class="state-actions"><button type="button" class="btn primary" data-action="nav" data-view="assets">返回资产</button></div></div>`;
        const reference = assetRef(entry.asset);
        const version = state.version;
        const actions = `<button type="button" class="btn" data-action="create-tag" aria-label="创建不可变版本标签">${icon("plus")}创建 v* 标签</button><button type="button" class="btn" data-action="move-prod" aria-label="移动 prod 发布通道">移动 prod</button><button type="button" class="btn primary" data-action="open-rollback" aria-label="打开回滚向导">回滚资产</button>`;
        const result = version.rollbackResult ? `<div class="inline-notice operation-result">${icon("check")}<div><strong>已生成未提交恢复变更</strong><br>仅当前资产被恢复；未自动提交、推送或移动 prod。可查看 HEAD 与工作区的差异，再通过 Git 评审流程提交。<div class="detail-actions"><button type="button" class="btn small" data-action="show-rollback-diff">查看恢复差异</button><button type="button" class="btn ghost small" data-action="nav" data-view="collab">查看 Git 评审指引</button></div></div></div>` : "";
        let historyBody;
        if (version.loading && !version.commits.length) historyBody = skeletonLines(6);
        else if (version.error) historyBody = `<div style="padding:16px">${errorNotice(version.error)}<button type="button" class="btn" data-action="retry-history">${icon("refresh")}重试历史</button></div>`;
        else historyBody = version.commits.length ? `<div class="commit-list">${version.commits.map(renderCommit).join("")}</div>` : '<div class="diff-empty">该资产暂无提交历史。空历史不会被显示为读取失败。</div>';
        return pageHead("历史与版本管理",`当前资产 ${reference} · 所有提交、标签和快照直接来自 Git。`,actions) + result + `<div class="history-grid"><section class="card history-card"><div class="history-card-head"><h2>资产提交历史</h2><span class="soft">${version.commits.length} 个提交</span></div>${historyBody}</section><section class="card history-card"><div class="history-card-head"><h2>版本标签</h2><span class="soft">${version.tags.length} 个标签</span></div>${version.tags.length ? `<div class="version-tags">${version.tags.map(renderVersionTag).join("")}</div>` : '<div class="diff-empty">暂无版本标签。创建后可立即在 CLI 中使用。</div>'}</section></div>${renderDiffPanel()}`;
      }

      function distributionRevisionLabel(revision) {
        if (!revision) return "—";
        if (typeof revision === "string") return revision;
        if (revision.type === "head") return "HEAD";
        if (revision.type === "working_tree") return "working-tree";
        if (revision.type === "commit") return revision.value;
        if (revision.type === "asset_tag") {
          const tag = revision.value;
          return `adock/${tag.asset.kind}/${tag.asset.id}/${tag.name}`;
        }
        return JSON.stringify(revision);
      }

      function distributionRevisionOptions(selected, defaultRevision) {
        const revisions = [{value:defaultRevision,label:defaultRevision === "HEAD" ? "默认回退 · HEAD 最新提交" : `默认发布通道 · ${defaultRevision}`}];
        if (defaultRevision !== "HEAD") revisions.push({value:"HEAD",label:"HEAD · 最新提交"});
        state.version.tags.forEach(tag => {
          if (!revisions.some(item => item.value === tag.full_name)) revisions.push({value:tag.full_name,label:`${tag.name} · ${shortSha(tag.commit)}`});
        });
        state.version.commits.forEach(commit => revisions.push({value:commit.commit,label:`${shortSha(commit.commit)} · ${commit.message.split("\n")[0]}`}));
        return revisions.map(revision => `<option value="${esc(revision.value)}" ${selected === revision.value ? "selected" : ""}>${esc(revision.label)}</option>`).join("");
      }

      function renderDistributionVariables(asset, distribution) {
        if (asset.metadata.kind !== "prompt") return '<div class="inline-notice">'+icon("info")+'<div>Skill 不使用 Prompt 变量；其入口和资源文件随完整快照分发，脚本不会被执行。</div></div>';
        const spec = asset.spec && asset.spec.value ? asset.spec.value : {};
        const variables = Array.isArray(spec.variables) ? spec.variables : [];
        if (!variables.length) return '<div class="muted" style="font-size:11px">该 Prompt 没有声明变量，正文将按快照原样分发。</div>';
        const disabled = distribution.planLoading || distribution.executing ? "disabled" : "";
        return `<div><div class="field-label" style="margin-bottom:8px">Prompt 变量</div><div class="distribution-variables">${variables.map(variable => {
          const value = Object.prototype.hasOwnProperty.call(distribution.variables, variable.name) ? distribution.variables[variable.name] : "";
          const requirement = variable.required ? "必填" : "可选";
          const placeholder = variable.default === null || variable.default === undefined ? "留空则不显式渲染" : `默认值：${variable.default}`;
          return `<div class="field"><label for="distribution-var-${esc(variable.name)}">${esc(variable.name)} <span class="soft">${requirement}</span></label><input id="distribution-var-${esc(variable.name)}" data-distribution-variable="${esc(variable.name)}" value="${esc(value)}" placeholder="${esc(placeholder)}" aria-label="Prompt 变量 ${esc(variable.name)}" autocomplete="off" ${disabled}><small>${esc(variable.description || "仅填写的变量会触发显式渲染；不会执行模板表达式。")}</small></div>`;
        }).join("")}</div></div>`;
      }

      function renderDistributionExecution(distribution) {
        const execution = distribution.execution;
        if (distribution.executionError) return `${errorNotice(distribution.executionError)}<div class="distribution-actions"><button type="button" class="btn" data-action="retry-distribution">${icon("refresh")}重新生成计划并安全重试</button></div>`;
        if (!execution) return "";
        const completed = execution.status === "completed";
        const statusLabels = {written:"已写入",unchanged:"未变化",failed:"失败",skipped:"已跳过"};
        return `<div class="distribution-plan-head"><div class="inline-notice ${completed ? "" : "error"}">${icon(completed ? "check" : "error")}<div><strong>${completed ? "分发已完成" : "分发未完成"}</strong><br>来源 commit：<span class="mono">${esc(distribution.plan.commit)}</span>${completed ? "<br>目标清单已更新；不会执行 Skill 脚本。" : "<br>已处理、失败和跳过项如下。修复目标问题后请重新生成计划，不直接复用失败计划。"}</div></div></div><div class="distribution-plan-list">${execution.files.map(file => `<div class="distribution-plan-item"><div class="distribution-plan-line"><span class="badge ${file.status === "failed" ? "error" : file.status === "skipped" ? "warn" : "success"}">${esc(statusLabels[file.status] || file.status)}</span><span class="distribution-plan-path mono">${esc(displayPath(file.target_path))}</span></div>${file.error ? `<div class="distribution-result-error">${esc(file.error.code)} · ${esc(file.error.reason)}<br>${esc(file.error.suggestion)}</div>` : ""}</div>`).join("")}</div><div class="distribution-actions"><button type="button" class="btn" data-action="${completed ? "replan-distribution" : "retry-distribution"}">${icon("refresh")}${completed ? "重新预览当前输入" : "重新生成计划并安全重试"}</button></div>`;
      }

      function renderDistributionPlan(distribution) {
        if (distribution.planLoading) return '<div class="distribution-empty"><span class="loading-inline"><span class="spinner"></span>正在读取 Git 快照并检查目标状态</span></div>';
        if (distribution.planError) return `<div class="distribution-body">${errorNotice(distribution.planError)}<button type="button" class="btn" data-action="retry-distribution">${icon("refresh")}修复后重试 dry-run</button></div>`;
        if (distribution.execution || distribution.executionError) return renderDistributionExecution(distribution);
        const plan = distribution.plan;
        if (!plan) return '<div class="distribution-empty">选择资产、目标和 revision 后执行 dry-run。<br>预览不会写入任何文件；正式执行前会再次检查计划是否过期。</div>';
        const statusLabels = {added:"新增",updated:"更新",unchanged:"不变",conflict:"冲突"};
        const conflictLabels = {unmanaged_file:"未纳管同名文件",locally_modified:"纳管文件本地修改"};
        const unmanaged = plan.files.some(file => file.conflict === "unmanaged_file");
        const managed = plan.files.some(file => file.conflict === "locally_modified");
        const blocked = plan.status === "blocked";
        let guidance = "";
        if (unmanaged) guidance = `<div class="distribution-body"><div class="inline-notice error">${icon("error")}<div><strong>未纳管冲突不可覆盖</strong><br>请先备份、移动或移除对应目标路径，再重新 dry-run。显式覆盖选项不会放开此类冲突。</div></div></div>`;
        else if (managed && blocked) guidance = `<div class="distribution-body"><label class="checkbox-field"><input type="checkbox" data-distribution-field="overwriteManaged" ${distribution.overwriteManaged ? "checked" : ""} ${distribution.executing ? "disabled" : ""}><span><strong>我确认覆盖上述已纳管文件的本地修改</strong><br>请先备份需要保留的内容。勾选后还需重新 dry-run，生成可执行的新计划。</span></label>${distribution.overwriteManaged ? '<div class="inline-notice warn" style="margin-top:10px">'+icon("info")+'<div>覆盖确认仅用于下一次计划；请点击“重新 dry-run”检查更新后的状态。</div></div>' : ""}</div>`;

      function renderDistribution() {

        const targetOptions = targets.map(target => `<option value="${esc(target.target)}" ${distribution.target === target.target ? "selected" : ""}>${esc(target.target)}</option>`).join("");

        const traeEditions = standard && distribution.scope === "user" && distribution.target === "trae" && options && Array.isArray(options.trae_edition_options) ? options.trae_edition_options : [];

        const scopeSelector = `<div class="field"><label>作用范围</label><div class="detail-actions"><button type="button" class="btn small ${standard && distribution.scope === "project" ? "primary" : ""}" data-action="set-distribution-scope" data-scope="project" ${disabled}>当前项目</button><button type="button" class="btn small ${standard && distribution.scope === "user" ? "primary" : ""}" data-action="set-distribution-scope" data-scope="user" ${disabled}>用户级</button><button type="button" class="btn small ${standard ? "" : "primary"}" data-action="${standard ? "advanced-distribution" : "configure-target"}" ${disabled || !options ? "disabled" : ""}>${standard ? "高级自定义" : "管理自定义"}</button></div><small>${standard ? (distribution.scope === "project" ? "写入当前工作区的官方项目目录。" : "写入当前用户的官方工具目录。") : "正在使用高级自定义目录；点击项目级或用户级即可恢复自动解析。"}</small></div>`;
        const locationText = !selectedTarget ? "选择目标工具后自动计算" : requiresTraeEdition ? "选择 Trae 版本后自动确定" : displayPath(selectedTarget.root);
        const locationNotice = `<div class="recent-path"><strong>${standard ? "自动目标位置（只读）" : "自定义目标位置"}</strong><span class="mono">${esc(locationText)}</span></div>`;
        const optionsState = distribution.optionsLoading ? '<div class="inline-notice"><span class="spinner" style="width:13px;height:13px"></span><div>正在解析工具目录…</div></div>' : distribution.optionsError ? `${errorNotice(distribution.optionsError)}<button type="button" class="btn small" data-action="retry-distribution-options">重试解析目标</button>` : !targets.length ? `<div class="inline-notice warn">${icon("info")}<div><strong>${standard ? "当前资产没有受支持的目标工具" : "高级模式还没有可用的自定义目录"}</strong>${standard ? "" : '<br>可添加自定义目录，或返回项目级/用户级自动分发。'}<div class="detail-actions"><button type="button" class="btn small" data-action="configure-target">高级自定义</button></div></div></div>` : "";
        return pageHead("安全分发",`当前资产 ${reference} · 选择 AI 工具与作用范围即可自动解析目录，无需前置配置。`,actions) + `<div class="distribution-grid"><section class="card distribution-card"><div class="history-card-head"><h2>1. 选择分发输入</h2><span class="soft">Git 快照 · 不切换分支</span></div><div class="distribution-body">${options && options.default_revision_fallback ? '<div class="inline-notice warn">'+icon("info")+'<div>当前资产的默认发布通道尚未创建，本次默认使用 HEAD；不会自动创建或移动发布标签。</div></div>' : ""}<form id="distribution-form" class="distribution-form"><div class="field"><label for="distribution-asset">资产</label><select id="distribution-asset" data-distribution-field="asset" ${disabled}>${assetOptions}</select></div><div class="field"><label for="distribution-target">目标 AI 工具</label><select id="distribution-target" data-distribution-field="target" ${disabled || !targets.length ? "disabled" : ""}>${targetOptions}</select><small>${standard ? "列出支持当前资产类型的工具，无需配置目录。" : "仅列出已有配置且支持当前资产的自定义目标。"}</small></div>${scopeSelector}${traeEditionField}${locationNotice}<div class="field"><label for="distribution-revision">来源 revision</label><select id="distribution-revision" data-distribution-field="revision" ${disabled}>${distributionRevisionOptions(distribution.revision || defaultRevision, defaultRevision)}</select><small>分发只允许可追溯的已提交快照，不提供 working-tree。</small></div>${renderDistributionVariables(asset, distribution)}${optionsState}<button type="submit" class="btn primary" ${disabled || distribution.optionsLoading || !options || !distribution.target || requiresTraeEdition ? "disabled" : ""}>${icon("check")}${distribution.planLoading ? "正在生成计划…" : "dry-run 预览分发计划"}</button></form></div></section><section class="card distribution-card"><div class="history-card-head"><h2>2. 核对计划与结果</h2><span class="soft">同一份计划用于预览与确认</span></div>${renderDistributionPlan(distribution)}</section></div>`;

      function renderCollab() {
        const owners = new Map();
        validAssets().forEach(asset => {
          (asset.metadata.owners || []).forEach(owner => {
            if (!owners.has(String(owner))) owners.set(String(owner), []);

        const root = state.workspace ? displayPath(state.workspace.root) : displayPath(state.currentPath) || "打开工作区后显示仓库路径";
        return pageHead("协作说明","从统一入口找到资产规范、负责人和评审路径。协作状态仍由 Git 平台管理。",'<button type="button" class="btn" data-action="nav" data-view="assets" aria-label="返回资产页面">返回资产</button>') + `<div class="collab-grid"><section class="card collab-card"><h2>新成员从这里开始</h2><p>以下是当前工作区内的规范入口位置。本轮仅提供协作说明，不伪造打开仓库文档的后端操作。</p><div class="doc-links"><div class="doc-link">${icon("file")}README · 团队统一入口<span class="mono">README.md</span></div><div class="doc-link">${icon("folder")}Prompt 目录与模板规范<span class="mono">prompts/</span></div><div class="doc-link">${icon("folder")}Skill 目录与资源规范<span class="mono">skills/</span></div><div class="doc-link">${icon("check")}Schema 与工作区校验<span class="mono">schemas/</span></div><div class="doc-link">${icon("file")}评审负责人配置<span class="mono">CODEOWNERS</span></div></div><div class="disabled-feature"><strong>当前边界</strong><br>MCP 注册与 Eval 不在当前 MVP 范围。本页面不提供不可用操作入口。</div></section><section class="card collab-card"><h2>资产负责人</h2><p>owners 来自当前真实资产元数据；CODEOWNERS 与合并权限由 Git 平台执行。</p>${owners.size ? [...owners.entries()].map(([owner,refs]) => `<div class="owner-row"><span class="mono">${esc(refs.join(" · "))}</span><strong>${esc(owner)}</strong></div>`).join("") : '<div class="muted">打开包含资产的工作区后，这里会显示负责人。</div>'}<div class="inline-notice" style="margin-top:16px">${icon("info")}<div>AgentDock 提供校验和资产详情，不复制 MR/PR 的评审状态。</div></div></section><section class="card collab-card wide" style="grid-column:1/-1"><h2>标准变更流程</h2><p>所有资产修改通过同一 Git 评审路径进入仓库；刷新后桌面端直接读取最新事实源。</p><div class="flow"><span class="flow-node">修改资产</span><span class="flow-arrow">→</span><span class="flow-node">本地校验</span><span class="flow-arrow">→</span><span class="flow-node">提交 MR / PR</span><span class="flow-arrow">→</span><span class="flow-node">负责人评审合并</span><span class="flow-arrow">→</span><span class="flow-node">刷新工作区</span></div><div class="recent-path"><strong>当前工作区</strong><span class="mono">${esc(displayPath(root))}</span></div></section></div>`;
      }

      function render() {
        renderChrome();
        let content;
        if (state.view === "collab") content = renderCollab();
        else if (state.view === "distribute" && state.workspace && !state.workspaceError && !state.assetsError && !(state.assetsLoaded && state.allEntries.length === 0)) content = renderDistribution();
        else if (state.loadingWorkspace && !state.workspace) content = loadingState("正在打开工作区", state.currentPath ? displayPath(state.currentPath) : "正在定位仓库与配置");
        else if (state.view === "history" && state.workspace && !state.workspaceError && !state.assetsError && !(state.assetsLoaded && state.allEntries.length === 0)) content = renderHistory();
        else if (state.workspaceError) content = renderWorkspaceError();
        else if (!state.workspace) content = renderWelcome();
        else if (state.assetsError) content = renderAssetsError();
        else if (state.assetsLoaded && state.allEntries.length === 0) content = renderEmptyWorkspace();
        else content = renderAssets();
        $("#main").innerHTML = `<div class="page">${content}</div>`;
        $("#main").setAttribute("aria-busy", String(state.loadingWorkspace || state.loadingAssets || state.detailLoading));
      }

      function renderKeepingFocus() {
        const active = document.activeElement;
        const field = active && active.dataset ? active.dataset.field : null;
        const variable = active && active.dataset ? active.dataset.distributionVariable : null;
        const start = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
        const end = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;
        render();
        const next = field ? document.querySelector(`[data-field="${field}"]`) : variable ? document.querySelector(`[data-distribution-variable="${variable}"]`) : null;
        if (!next) return;
        next.focus();
        if (start !== null && typeof next.setSelectionRange === "function") {
          try { next.setSelectionRange(start, end); } catch (_) { /* select 不支持选区。 */ }
        }
      }

      function resetDistributionContext() {
        distributionEpoch += 1;
        distributionOptionsEpoch += 1;
        state.distribution = {
          ref: null, options: null, optionsLoading: false, optionsError: null,
          mode: "standard", scope: "project", traeEdition: null, target: "", revision: "", variables: {}, overwriteManaged: false,
          plan: null, planLoading: false, planError: null,
          executing: false, execution: null, executionError: null
        };
      }

      function invalidateDistributionResults() {
        distributionEpoch += 1;
        state.distribution.plan = null;
        state.distribution.planLoading = false;
        state.distribution.planError = null;
        state.distribution.executing = false;
        state.distribution.execution = null;
        state.distribution.executionError = null;
      }

      function resetVersionContext() {
        resetDistributionContext();
        historyEpoch += 1;
        diffEpoch += 1;
        state.version = {
          ref: null, commits: [], tags: [], loading: false, error: null,
          from: "", to: "", diff: null, diffLoading: false, diffError: null,
          rollbackResult: null, rollbackPreview: null, prodPreview: null

      }

      function invalidateVersionResults() {

        state.version.diff = null;
        state.version.diffLoading = false;
        state.version.diffError = null;
        state.version.rollbackResult = null;
        state.version.rollbackPreview = null;
        state.version.prodPreview = null;
      }

      function clearContext(clearFilters) {
        detailEpoch += 1;
        resetVersionContext();

        state.selectedKey = null;

      function ensureWorkspaceInfo(info, path, operation = "discover_workspace") {
        if (!info || typeof info !== "object" || typeof info.root !== "string" || !info.root || typeof info.config_path !== "string") {
          throw {code:"invalid_contract",operation,subject:path || "工作区",reason:"桌面命令未返回有效的 root 与 config_path。",suggestion:"请检查桌面 DTO 与 WorkspaceInfo 的 serde 契约。"};
        }
        return info;
      }

      function normalizeEntries(result) {
        if (!Array.isArray(result)) {
          throw {code:"invalid_contract",operation:"list_assets",subject:state.workspace ? state.workspace.root : "工作区",reason:"list_assets 未返回数组。",suggestion:"请检查桌面命令返回结构。"};
        }
        return result.map((item, index) => {
          let asset = null;
          let error = null;
          if (item && typeof item === "object" && ("asset" in item || "error" in item)) {
            asset = item.asset || null;
            error = item.error ? normalizeError(item.error, "list_assets", `资产 #${index + 1}`) : null;
          } else if (item && typeof item === "object") {
            asset = item;
          }
          if (asset && (!asset.metadata || !asset.metadata.kind || !asset.metadata.id)) {
            error = normalizeError({code:"invalid_contract",operation:"list_assets",subject:`资产 #${index + 1}`,reason:"资产缺少 metadata.kind 或 metadata.id。",suggestion:"请检查 Asset serde 返回结构。"});
            asset = null;
          }
          if (!asset && !error) {
            error = normalizeError({code:"invalid_contract",operation:"list_assets",subject:`资产 #${index + 1}`,reason:"列表项既没有有效资产，也没有错误诊断。",suggestion:"请检查列表 DTO。"});
          }
          return {key:`entry-${index}`,asset,error};
        });
      }

      async function loadDetail(entry) {
        if (!entry || !state.workspace) return;
        if (!entry.asset) {
          state.detail = null;
          state.detailError = null;
          state.detailLoading = false;
          render();
          return;
        }
        const epoch = ++detailEpoch;
        const root = state.workspace.root;
        const reference = assetRef(entry.asset);
        state.detail = null;
        state.detailError = null;
        state.detailLoading = true;
        render();
        try {
          const asset = await invoke("show_asset", {path:root,reference});
          if (epoch !== detailEpoch || state.selectedKey !== entry.key) return;
          if (!asset || !asset.metadata) throw {code:"invalid_contract",operation:"show_asset",subject:reference,reason:"命令未返回有效 Asset。",suggestion:"请检查 Asset serde 返回结构。"};
          state.detail = asset;
          state.detailLoading = false;
          render();
        } catch (error) {
          if (epoch !== detailEpoch) return;
          state.detailLoading = false;
          state.detailError = normalizeError(error, "show_asset", reference);
          render();
        }
      }

      async function loadAssetHistory(entry) {
        if (!state.workspace || !entry || !entry.asset) {
          resetVersionContext();
          render();
          return;
        }
        const root = state.workspace.root;
        const reference = assetRef(entry.asset);
        if (state.version.ref !== reference) {
          resetVersionContext();
          state.version.ref = reference;
        } else {
          invalidateVersionResults();
        }
        const epoch = ++historyEpoch;
        state.version.loading = true;
        state.version.error = null;
        render();
        try {
          const result = await invoke("get_asset_history", {path:root,reference,limit:100});
          if (epoch !== historyEpoch || state.version.ref !== reference || !state.workspace || state.workspace.root !== root) return;
          if (!result || !Array.isArray(result.commits) || !Array.isArray(result.tags)) {
            throw {code:"invalid_contract",operation:"get_asset_history",subject:reference,reason:"历史命令未返回 commits 与 tags 数组。",suggestion:"请检查桌面历史 DTO。"};
          }
          state.version.commits = result.commits;
          state.version.tags = result.tags;
          state.version.loading = false;
          render();
        } catch (error) {
          if (epoch !== historyEpoch) return;
          state.version.loading = false;
          state.version.error = normalizeError(error, "get_asset_history", reference);
          render();
        }
      }

      async function compareAssets(from, to) {
        const entry = selectedEntry();
        if (!state.workspace || !entry || !entry.asset) return;
        const reference = assetRef(entry.asset);
        state.version.from = from;
        state.version.to = to;
        state.version.rollbackResult = null;
        if (!from || !to || from === to) {
          state.version.diff = null;
          state.version.diffError = normalizeError({
            code:"invalid_input",operation:"desktop.diff",subject:reference,
            reason:!from || !to ? "比较起点和终点都必须明确选择。" : "同一 revision 没有比较意义。",
            suggestion:"请选择两个不同的明确 revision。"
          });
          render();
          return;
        }
        const root = state.workspace.root;
        const epoch = ++diffEpoch;
        state.version.diff = null;
        state.version.diffError = null;
        state.version.diffLoading = true;
        render();
        try {
          const diff = await invoke("diff_asset", {path:root,reference,from,to});
          if (epoch !== diffEpoch || state.version.ref !== reference) return;
          state.version.diff = diff;
          state.version.diffLoading = false;
          render();
        } catch (error) {
          if (epoch !== diffEpoch) return;
          state.version.diffLoading = false;
          state.version.diffError = normalizeError(error, "diff_asset", reference);
          render();
        }
      }

      async function loadDistributionOptions(entry) {
        if (!state.workspace || !entry || !entry.asset) {
          resetDistributionContext();
          render();
          return;
        }
        const root = state.workspace.root;
        const reference = assetRef(entry.asset);
        if (state.distribution.ref !== reference) resetDistributionContext();
        state.distribution.ref = reference;
        const mode = state.distribution.mode;
        const scope = state.distribution.scope;
        const traeEdition = state.distribution.traeEdition;
        const command = mode === "custom" ? "get_distribution_options" : "get_scoped_distribution_options";
        const args = mode === "custom" ? {path:root,reference} : {path:root,reference,scope,traeEdition};
        const epoch = ++distributionOptionsEpoch;
        state.distribution.optionsLoading = true;
        state.distribution.optionsError = null;
        render();
        try {
          const options = await invoke(command, args);
          if (epoch !== distributionOptionsEpoch || state.distribution.ref !== reference || state.distribution.mode !== mode || state.distribution.scope !== scope || state.distribution.traeEdition !== traeEdition || !state.workspace || state.workspace.root !== root) return;
          if (!options || !Array.isArray(options.targets) || !Array.isArray(options.supported_targets) || typeof options.default_revision !== "string") {
            throw {code:"invalid_contract",operation:command,subject:reference,reason:"目标命令未返回 default_revision、targets 与 supported_targets。",suggestion:"请检查桌面分发 DTO。"};
          }
          state.distribution.options = options;
          if (!options.targets.some(target => target.target === state.distribution.target)) state.distribution.target = options.targets.length ? options.targets[0].target : "";
          state.distribution.revision = options.default_revision;
          state.distribution.optionsLoading = false;

        } catch (error) {
          if (epoch !== distributionOptionsEpoch) return;

          state.distribution.optionsError = normalizeError(error, command, reference);
          render();
        }
      }

      function selectDistributionAsset(key) {
        const entry = state.entries.find(item => item.key === key);

        loadDetail(entry);
        loadAssetHistory(entry);
        loadDistributionOptions(entry);

      async function openAdvancedDistribution() {
        const entry = selectedEntry();
        const context = currentAssetContext();
        if (!entry || !entry.asset || !context) return;

        state.distribution.mode = "custom";
        state.distribution.traeEdition = null;
        state.distribution.options = null;
        state.distribution.optionsError = null;
