    const assets = [
      {ref:"prompt:code-review",kind:"prompt",title:"代码评审助手",desc:"从正确性、可维护性与安全性三个维度生成结构化代码评审意见。",owner:"林舟",labels:["质量","研发"],version:"v1.2.0",files:["prompts/code-review.md"],body:"你是一名资深代码评审专家。请评审 {{component}} 的变更。\n\n关注重点：{{focus}}\n\n请按严重程度输出问题，并说明：\n1. 问题位置与影响\n2. 可复现条件\n3. 推荐修复方式\n\n不要修改业务行为，不输出未经证据支持的结论。",variables:[["component","被评审的模块或组件",true,"—"],["focus","本次评审重点",false,"correctness"]]},
      {ref:"prompt:release-note",kind:"prompt",title:"发布说明生成器",desc:"将合并记录整理为面向研发与用户的双版本发布说明。",owner:"周遥",labels:["发布","文档"],version:"v1.0.3",files:["prompts/release-note.md"],body:"根据 {{milestone}} 的合并记录生成发布说明。\n\n将变更分为新增、修复和内部改进；不夸大用户价值。",variables:[["milestone","发布里程碑",true,"—"]]},

      {ref:"skill:api-contract",kind:"skill",title:"API 契约检查",desc:"检查接口变更的兼容性，生成调用方影响清单与迁移提示。",owner:"陈墨",labels:["质量","API"],version:"v2.0.0",files:["skills/api-contract/SKILL.md","skills/api-contract/references/checklist.md","skills/api-contract/templates/report.md"],triggers:["接口字段或状态码发生变化","准备发布不兼容变更"],dependencies:["外部工具：OpenAPI 解析器"],entrypoint:"SKILL.md",body:"比较两个接口契约快照，列出路径、字段、状态码和权限语义变化。"}
    ];
    const commits = [
      {sha:"c8f3a21",full:"c8f3a21d8e42f90ab3f6c5d8a3e72f9a0412b88e",message:"补充评审证据与修复建议要求",author:"林舟",time:"2026-10-28 16:42",tag:"v1.2.0"},
      {sha:"a91e7b2",full:"a91e7b2c08a2f86de334cf02b118fa17eb55c901",message:"统一 Prompt 变量声明格式",author:"周遥",time:"2026-10-21 11:08",tag:"v1.1.0"},

    const state = {view:"assets",scenario:"normal",selected:"prompt:code-review",filters:{search:"",kind:"all",owner:"all",label:"all"},historyFrom:"v1.1.0",historyTo:"v1.2.0",diffMode:"split",createdTags:[],prodRev:"v1.1.0",workingChange:false,tagDraft:"",dist:{step:"config",asset:"prompt:code-review",target:"claude-code",ref:"prod",variables:{component:"desktop",focus:"correctness"},overwrite:false,error:"",plan:null,retry:false}};
    const navItems = [["assets","资产","assets","4"],["history","历史","history",""],["distribute","分发","distribute",""],["collab","协作说明","collab",""]];
    const currentAsset = () => assets.find(a => a.ref === state.selected) || assets[0];
    const distAsset = () => assets.find(a => a.ref === state.dist.asset) || assets[0];
    const scenarioNames = {normal:"正常",empty:"空仓库","config-error":"配置错误","non-git":"非 Git","asset-error":"单资产损坏","unmanaged-conflict":"未纳管冲突","managed-modified":"已纳管修改","write-failure":"写入失败"};
    let toastTimer;
    function toast(message){clearTimeout(toastTimer);$("#toast-root").innerHTML=`<div class="toast">${icon("check")}<span>${esc(message)}</span></div>`;toastTimer=setTimeout(()=>$("#toast-root").innerHTML="",3200)}
    function renderChrome(){
      navItems[0][3]=state.scenario==="empty"?"0":"4";
      $("#main-nav").innerHTML=navItems.map(([id,label,ico,count])=>`<button class="nav-btn ${state.view===id?"active":""}" data-action="nav" data-view="${id}">${icon(ico)}<span>${label}</span>${count?`<span class="nav-count">${count}</span>`:""}</button>`).join("");
      $("#refresh-icon").innerHTML=icon("refresh");

      $("#branch-status").innerHTML=`${icon("git")}<span>main</span><span class="badge ${bad?"error":"success"}"><span class="status-dot ${bad?"error":""}"></span>${state.scenario==="non-git"?"非 Git":state.scenario==="config-error"?"配置错误":"工作区正常"}</span>`;
      $("#scenario-select").value=state.scenario;

    function render(){renderChrome();let html;if(state.scenario==="config-error"&&state.view!=="collab")html=renderStatePage("config");else if(state.scenario==="non-git"&&state.view!=="collab")html=renderStatePage("git");else if(state.scenario==="empty"&&!["collab"].includes(state.view))html=renderStatePage("empty");else html=({assets:renderAssets,history:renderHistory,distribute:renderDistribution,collab:renderCollab}[state.view]||renderAssets)();$("#main").innerHTML=`<div class="page">${html}</div>`}
    function pageHead(title,desc,actions=""){return `<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div><div class="head-actions">${actions}</div></div>`}
    function filteredAssets(){const f=state.filters;return assets.filter(a=>(f.kind==="all"||a.kind===f.kind)&&(f.owner==="all"||a.owner===f.owner)&&(f.label==="all"||a.labels.includes(f.label))&&(!f.search||`${a.title}${a.ref}${a.desc}`.toLowerCase().includes(f.search.toLowerCase())))}
    function renderAssets(){

      return pageHead("能力资产","发现团队沉淀的 Prompt 与 Skill，选择可信版本后分发到本机。",actions)+`<div class="asset-layout"><section class="card asset-browser"><div class="filters"><div class="search">${icon("search")}<input data-field="search" value="${esc(state.filters.search)}" placeholder="搜索名称、ID 或说明" aria-label="搜索资产"></div><div class="filter-row"><select data-field="kind" aria-label="资产类型"><option value="all">全部类型</option><option value="prompt" ${state.filters.kind==="prompt"?"selected":""}>Prompt</option><option value="skill" ${state.filters.kind==="skill"?"selected":""}>Skill</option></select><select data-field="owner" aria-label="负责人"><option value="all">全部负责人</option>${["林舟","周遥","陈墨"].map(o=>`<option ${state.filters.owner===o?"selected":""}>${o}</option>`).join("")}</select><select data-field="label" aria-label="分类标签"><option value="all">全部分类标签</option>${["质量","研发","发布","文档","效率","新人","API"].map(o=>`<option ${state.filters.label===o?"selected":""}>${o}</option>`).join("")}</select></div></div><div class="list-meta"><span>${list.length} 项资产</span><span>按最近更新排序</span></div><div class="asset-list">${list.length?list.map(renderAssetItem).join(""):`<div class="empty-filter">没有符合当前条件的资产。<br><button class="btn small" data-action="clear-filters">清除过滤</button></div>`}</div></section>${renderAssetDetail()}</div>`

    function renderAssetItem(a){const broken=state.scenario==="asset-error"&&a.ref==="skill:repo-onboarding";return `<button class="asset-item ${state.selected===a.ref?"active":""}" data-action="select-asset" data-ref="${a.ref}"><span class="asset-item-head"><span class="badge ${a.kind}">${a.kind==="prompt"?"P":"S"}</span><strong>${a.title}</strong>${broken?'<span class="badge error">错误</span>':""}</span><span class="ref mono">${a.ref}</span><span class="desc">${a.desc}</span><span class="asset-item-foot"><span>${a.owner} · ${a.labels.join(" / ")}</span><span class="mono">${a.version}</span></span></button>`}
    function renderAssetDetail(){
      const a=currentAsset();
      if(state.scenario==="asset-error"&&a.ref==="skill:repo-onboarding")return `<section class="card asset-detail"><div class="detail-hero"><div class="detail-title"><span class="badge skill">Skill</span><h2>${a.title}</h2><span class="badge error">解析失败</span></div><div class="detail-ref mono">${a.ref}</div></div><div class="detail-section"><div class="inline-notice error">${icon("error")}<div><strong>无法读取 SKILL.md 的 Front Matter</strong><br>skills/repo-onboarding/SKILL.md · 第 7 行：owners 必须至少包含一名负责人。<br>修复该文件后可重新校验；其他正常资产不受影响。</div></div><div class="detail-actions"><button class="btn" data-action="open-doc">查看 Skill 规范</button><button class="btn primary" data-action="validate">重新校验</button></div></div></section>`;
      const created=state.createdTags.filter(t=>t.ref===a.ref);
      return `<section class="card asset-detail"><div class="detail-hero"><div class="detail-title"><span class="badge ${a.kind}">${a.kind==="prompt"?"Prompt":"Skill"}</span><h2>${a.title}</h2></div><div class="detail-ref mono">${a.ref} · ${a.kind==="prompt"?a.files[0]:a.files[0].replace("/SKILL.md","")}</div><p class="detail-desc">${a.desc}</p><div class="detail-actions"><button class="btn" data-action="nav" data-view="history">${icon("history")}查看历史</button><button class="btn primary" data-action="start-dist">${icon("distribute")}进入分发</button></div></div><div class="release-strip"><span class="release-item"><span class="soft">发布通道</span><span class="tag version mono">prod → ${state.prodRev}</span></span><span class="release-item"><span class="soft">最新版本</span><span class="tag version mono">${a.version}</span></span>${created.map(t=>`<span class="tag version mono">${esc(t.name)}</span>`).join("")}<span class="spacer"></span><span class="soft mono">HEAD ${commits[0].sha}</span></div><div class="detail-section"><h3 class="section-title">资产信息<span class="badge success">校验通过</span></h3><dl class="meta-grid"><div class="meta-item"><dt>负责人</dt><dd>${a.owner}</dd></div><div class="meta-item"><dt>分类标签</dt><dd class="tags">${a.labels.map(x=>`<span class="tag">${x}</span>`).join("")}</dd></div><div class="meta-item"><dt>API 版本</dt><dd class="mono">adock/v1alpha1</dd></div></dl></div>${a.kind==="prompt"?renderPromptInfo(a):renderSkillInfo(a)}<div class="detail-section"><h3 class="section-title">源文件<span class="soft">${a.files.length} 个文件</span></h3>${a.files.map(f=>`<div class="file-row">${icon("file")}<span class="mono">${f}</span></div>`).join("")}</div></section>`

    function initModal(){openModal(modalHead("初始化新工作区","仅允许在空目录中创建，不会覆盖已有非空目录。")+`<div class="modal-body"><div class="field"><label>空目录路径</label><input class="mono" value="D:\\team\\new-assets" aria-label="初始化目录"></div><div class="summary-list"><div class="summary-row"><span>资产配置</span><span class="mono">adock.yaml / schemas/</span></div><div class="summary-row"><span>能力目录</span><span class="mono">prompts/ / skills/</span></div><div class="summary-row"><span>统一入口</span><span class="mono">README.md / CODEOWNERS</span></div><div class="summary-row"><span>示例资产</span><span>1 个 Prompt + 1 个多文件 Skill</span></div></div></div><div class="modal-foot"><button class="btn" data-action="workspace">返回</button><button class="btn primary" data-action="confirm-init">确认初始化</button></div>`)}
    function tagModal(){state.tagDraft="";const a=currentAsset();openModal(modalHead("创建不可变版本标签","基于明确 revision 创建 v* 标签；不会自动推送。")+`<div class="modal-body"><div class="field"><label>资产</label><input class="mono" value="${a.ref}" disabled></div><div class="field"><label>标签名</label><input data-field="tag-name" placeholder="例如 v1.3.0" autocomplete="off"><small>已存在的 v* 标签不可覆盖。</small></div><div class="field"><label>基于 revision</label><select><option>HEAD · ${commits[0].sha}</option><option>${commits[1].sha} · v1.1.0</option></select></div><div class="tag-preview mono" id="tag-preview">adock/${a.kind}/${a.ref.split(":")[1]}/&lt;tag&gt;</div><div class="field-error" id="tag-error"></div></div><div class="modal-foot"><button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="create-tag">创建版本标签</button></div>`)}
    function prodModal(){const a=currentAsset();openModal(modalHead("确认移动 prod","这是发布通道变更，不会修改资产内容，也不会自动推送。")+`<div class="modal-body"><div class="confirm-hero"><div class="confirm-rev"><small>当前指向</small><strong class="mono">${state.prodRev}</strong></div><span class="soft">→</span><div class="confirm-rev"><small>目标指向</small><strong class="mono">${esc(state.historyTo)}</strong></div></div><div class="inline-notice warn">${icon("info")}<div>完整标签：<span class="mono">adock/${a.kind}/${a.ref.split(":")[1]}/prod</span><br>移动后，团队成员默认分发时将解析到目标 revision。</div></div></div><div class="modal-foot"><button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="confirm-prod">确认移动 prod</button></div>`)}
    function rollbackModal(){const a=currentAsset();openModal(modalHead("预览并恢复资产","回滚只生成目标资产的未提交变更，不改写 Git 历史。")+`<div class="modal-body"><div class="confirm-hero"><div class="confirm-rev"><small>当前工作区</small><strong class="mono">working-tree</strong></div><span class="soft">→</span><div class="confirm-rev"><small>目标快照</small><strong class="mono">${esc(state.historyTo)}</strong></div></div><div class="card result-files"><table class="file-table"><thead><tr><th>恢复范围</th><th>变化</th></tr></thead><tbody>${a.kind==="prompt"?`<tr><td class="mono">${a.files[0]}</td><td><span class="badge warn">修改</span></td></tr>`:a.files.map((f,i)=>`<tr><td class="mono">${f}</td><td><span class="badge ${i===1?"success":"warn"}">${i===1?"恢复新增":"修改"}</span></td></tr>`).join("")}</tbody></table></div><div class="inline-notice">${icon("check")}<div><strong>目标资产路径没有未提交修改</strong><br>只恢复 ${a.ref}；其他资产、分支和 Git 历史不受影响。不会自动提交或移动 prod。</div></div></div><div class="modal-foot"><button class="btn" data-action="close-modal">取消</button><button class="btn danger" data-action="confirm-rollback">确认生成恢复变更</button></div>`,true)}
    document.addEventListener("click",event=>{
      const el=event.target.closest("[data-action]");if(!el)return;const action=el.dataset.action;
      if(action==="backdrop"){if(event.target===el)closeModal();return}
      if(action==="close-modal"){closeModal();return}
      if(action==="nav"){state.view=el.dataset.view;render();return}
      if(action==="workspace"){workspaceModal();return}
      if(action==="init-workspace"){initModal();return}
      if(action==="open-workspace"){closeModal();toast("工作区已打开，资产视图已刷新");return}
      if(action==="confirm-init"){closeModal();toast("初始化预览完成：示例工作区已就绪");return}
      if(action==="refresh"){toast(`已重新读取 Git 与文件系统 · ${scenarioNames[state.scenario]}`);return}
      if(action==="select-asset"){state.selected=el.dataset.ref;state.historyFrom="v1.1.0";state.historyTo="v1.2.0";render();return}
      if(action==="clear-filters"){state.filters={search:"",kind:"all",owner:"all",label:"all"};render();return}
      if(action==="validate"){toast(state.scenario==="asset-error"?"校验完成：3 项通过，1 项存在错误":"校验通过：4 项资产均符合 adock/v1alpha1");return}
      if(action==="new-asset"){toast("已打开新增资产指引；MVP 通过 Git 评审接收变更");return}
      if(action==="open-doc"){toast("原型演示：将打开对应仓库文档");return}
      if(action==="start-dist"){state.dist.asset=state.selected;state.dist.step="config";state.dist.plan=null;state.dist.error="";state.view="distribute";render();return}
      if(action==="select-commit"){state.historyTo=el.dataset.sha;render();return}
      if(action==="diff-mode"){state.diffMode=el.dataset.mode;render();return}
      if(action==="tag-modal"){tagModal();return}
      if(action==="prod-modal"){prodModal();return}
      if(action==="rollback-modal"){rollbackModal();return}
      if(action==="create-tag"){const name=state.tagDraft.trim(),a=currentAsset();if(!/^v[A-Za-z0-9][A-Za-z0-9._-]*$/.test(name)||name.includes("..")){$("#tag-error").textContent="请输入有效的 v* 标签名，例如 v1.3.0。";return}if(name===a.version||state.createdTags.some(t=>t.ref===a.ref&&t.name===name)){$("#tag-error").textContent=`${name} 已存在，不可变版本标签不能覆盖。`;return}state.createdTags.push({ref:a.ref,name});closeModal();render();toast(`已创建 adock/${a.kind}/${a.ref.split(":")[1]}/${name}，未自动推送`);return}
      if(action==="confirm-prod"){state.prodRev=state.historyTo;closeModal();render();toast(`prod 已移动至 ${state.prodRev}，未修改资产内容或推送标签`);return}
      if(action==="confirm-rollback"){state.workingChange=true;closeModal();render();toast("已生成单资产未提交恢复变更，未自动提交或移动 prod");return}
      if(action==="dist-target"){state.dist.target=el.dataset.target;state.dist.plan=null;render();return}
      if(action==="dry-run"){if(distAsset().kind==="prompt"&&!state.dist.variables.component.trim()){state.dist.error="必填变量 component 尚未提供值，请填写后重新生成计划。";render();return}state.dist.error="";state.dist.overwrite=false;state.dist.retry=false;state.dist.plan=makePlan();state.dist.step="plan";render();return}
      if(action==="dist-back"){state.dist.step="config";state.dist.plan=null;state.dist.overwrite=false;render();return}
      if(action==="execute-dist"){const p=state.dist.plan,blocked=p.files.some(f=>f.status==="unmanaged")||(p.files.some(f=>f.status==="managed")&&!state.dist.overwrite);if(blocked)return;state.dist.step="result";render();return}
      if(action==="retry-dist"){state.dist.retry=true;render();toast("目标状态已重新检查，剩余文件写入成功");return}
      if(action==="new-dist"){state.dist.step="config";state.dist.plan=null;state.dist.retry=false;render();return}
    });
    document.addEventListener("input",event=>{const el=event.target;if(el.dataset.field==="search"){state.filters.search=el.value;render();const input=$('[data-field="search"]');input.focus();input.setSelectionRange(input.value.length,input.value.length)}if(el.dataset.field==="tag-name"){state.tagDraft=el.value;const a=currentAsset();$("#tag-preview").textContent=`adock/${a.kind}/${a.ref.split(":")[1]}/${el.value||"<tag>"}`;$("#tag-error").textContent=""}if(el.dataset.variable){state.dist.variables[el.dataset.variable]=el.value;state.dist.error=""}});
    document.addEventListener("change",event=>{const el=event.target;if(el.id==="scenario-select"){state.scenario=el.value;state.view=["unmanaged-conflict","managed-modified","write-failure"].includes(el.value)?"distribute":"assets";state.dist.step="config";state.dist.plan=null;state.dist.overwrite=false;state.dist.retry=false;closeModal();render();return}const field=el.dataset.field;if(["kind","owner","label"].includes(field)){state.filters[field]=el.value;render()}if(field==="history-from"){state.historyFrom=el.value;render()}if(field==="history-to"){state.historyTo=el.value;render()}if(field==="dist-asset"){state.dist.asset=el.value;state.selected=el.value;state.dist.plan=null;state.dist.error="";render()}if(field==="dist-ref"){state.dist.ref=el.value;state.dist.plan=null;render()}if(field==="overwrite"){state.dist.overwrite=el.checked;render()}});
    document.addEventListener("keydown",event=>{if(event.key==="Escape"&&$("#modal-root").children.length)closeModal()});
    render();
  </script>
</body>
</html>
