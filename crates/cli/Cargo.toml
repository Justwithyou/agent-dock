[package]
name = "adock-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "adock"
path = "src/main.rs"

[dependencies]
adock-adapters = { path = "../adapters" }
adock-core = { path = "../core" }
adock-infra = { path = "../infra" }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile.workspace = true
