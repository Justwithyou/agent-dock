name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Validate initialized assets
        shell: pwsh
        run: |
          $assets = Join-Path $env:RUNNER_TEMP "adock-assets"
          cargo run -p adock-cli -- --workspace $assets init
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run -p adock-cli -- --workspace $assets validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build release CLI
        run: cargo build --release -p adock-cli

      - name: Build Windows desktop installer
        working-directory: crates/desktop
        shell: pwsh
        run: npx --yes @tauri-apps/cli@2 build

      - name: Upload Windows release candidates
        uses: actions/upload-artifact@v4
        with:
          name: agentdock-windows-x64
          path: |
            target/release/adock.exe
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
